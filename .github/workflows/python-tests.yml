name: Python Tests

# When this workflow runs:
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest # Linux virtual machine
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - name: Check out the repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies and the project (src/ layout)
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt

    - name: Run all tests (unit + integration)
      run: |
        python -m unittest discover -s tests -v

    - name: Smoke test of the entry points
      run: |
        echo 0 | python vault_cli.py --home "$RUNNER_TEMP/vault_home"
        python -c "import vault; from vault.app import VaultApp; print('vault package OK')"
