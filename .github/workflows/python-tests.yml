name: Python Unit Tests

# Cuándo debe ejecutarse esta automatización:
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest # Usa una máquina virtual de Linux

    steps:
    - name: Descargar el código del repositorio
      uses: actions/checkout@v4
    
    - name: Configurar Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12" # Asegura compatibilidad con tu código
        
    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Ejecutar pruebas unitarias (D3)
      run: |
        python -m unittest discover -s tests  